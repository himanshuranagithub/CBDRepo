<template>
    <lightning-card title="Schedule Deployment" icon-name="custom:custom63" class="scheduler-card">
        <div class="slds-m-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner size="medium" alternative-text="Loading" class="spinner"></lightning-spinner>
            </template>

            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Package Name</th>
                        <th>Scheduled Time</th>
                        <th>Status</th>
                        <th>Job Completion Status</th>
                        <th>Deployment Result</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={packages} for:item="pkg">
                        <tr key={pkg.Id}>
                            <td>{pkg.PackageName}</td>
                            <td>{pkg.displayScheduledTime}</td>
                            <td>{pkg.Status}</td>
                            <td>{pkg.JobCompletionStatus}</td>
                            <td>{pkg.DeploymentResult}</td>
                            <td>
                                <template if:true={pkg.showDatePicker}>
                                    <lightning-button
                                        label={pkg.actionLabel} 
                                        onclick={handleScheduleClick}
                                        data-id={pkg.Id}
                                        variant="brand"
                                        disabled={pkg.disabled} 
                                    ></lightning-button>
                                    <lightning-input
                                        type="datetime-local"
                                        label="Select Schedule Time"
                                        onchange={handleDateChange}
                                        data-id={pkg.Id}
                                    ></lightning-input>
                                </template>

                                <template if:true={pkg.isScheduled}>
                                    <lightning-button
                                        label={pkg.actionLabel}
                                        onclick={handleDeployClick}
                                        data-id={pkg.Id}
                                        variant="brand"
                                        disabled={pkg.disabled} 
                                    ></lightning-button>
                                </template>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </lightning-card>
</template>
