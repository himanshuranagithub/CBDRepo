<template>
    <template if:true={error}>
        <lightning-card title="Error Occurred">
            <div>Error Occurred</div>
        </lightning-card>
    </template>
    <template if:false={error}>
        <lightning-card title="Error not Occurred">
        <div>Error did not occur</div>
    </lightning-card>
    </template>
    <c-child-hello-word></c-child-hello-word>
    <lightning-button variant="brand" label="Change Template" onclick={toggleTemplate}></lightning-button>
</template>
