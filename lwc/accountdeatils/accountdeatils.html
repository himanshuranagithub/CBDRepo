<template>
     &nbsp;
    <lightning-card title="Account List">
         
                 
         <template if:false={showForm}>
              
            </template>
             
            <template if:true={showForm}>
              
        <div class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Create New Account</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    
                    <lightning-record-edit-form
                        object-api-name="Account"
                        onsuccess={handleSucces}
                    >
                    
                        <div class="slds-grid slds-gutters">
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input-field field-name="Name"></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input-field field-name="email__c"></lightning-input-field>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input-field field-name="Phone"></lightning-input-field>
                            </div>
                        </div>
                        <div class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={closeCreateForm}>Cancel</button>
                            <lightning-button
                                class="slds-m-top_small"
                                variant="brand"
                                type="submit"
                                name="create"
                                label="Create Account"
                            >
                            </lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </div>
            </div>
        </div>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
     &nbsp; &nbsp; &nbsp;
        <div class="slds-p-around_medium">
            <lightning-button label="Delete Selected" onclick={handleButtonClick} variant="destructive"></lightning-button>
            &nbsp;
            <lightning-button label="Send Email" onclick={sendEmail}  variant="brand" disabled={disableDeleteButton}></lightning-button>
             &nbsp;
              <lightning-button label="Create New Account"  variant="brand" onclick={openCreateForm}></lightning-button>
               &nbsp;
                <lightning-button label="Fetch Contacts"  variant="brand" onclick={fetchContacts}></lightning-button>
        </div>
           <div class="slds-p-around_medium">
          <div class="slds-p-around_medium">
    <lightning-input label="Search" value={searchKey} onchange={handleSearch} class="custom-search-bar"></lightning-input>
</div>

        </div>
        
        <lightning-datatable
            key-field="Id"
            data={displayedAccounts}
            columns={columns}
            checkbox-column
            onrowselection={handleRowSelection}
            onrowaction={handleRowAction}>
             
        </lightning-datatable>
        <lightning-layout multiple-rows horizontal-align="space" class="slds-var-m-around_medium">
                    <lightning-layout-item  flexibility="auto">
                        <lightning-button variant="brand"
                         icon-name="utility:chevronleft" 
                         name="previous"
                        label="Previous" 
                        onclick={handlePrevious} ></lightning-button>
                    </lightning-layout-item>
                 <lightning-layout flexibility="auto" class="slds-var-m-around_small"> 
                    <b> Displaying {currentPage} of {totalPages} Page || {end} of {totalRecordCount} records</b> 
                    
                 </lightning-layout>
                    <lightning-layout-item flexibility="auto">
                        <lightning-button variant="brand" 
                        label="Next" 
                        name="next"
                        icon-name="utility:chevronright"
                         onclick={handleNext} ></lightning-button>
                    </lightning-layout-item>
                    
                </lightning-layout>
    </lightning-card>
 <template if:true={isEditFormOpen}>
    <div class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <div class="slds-modal__header">
                <h2 class="slds-text-heading_medium">Edit Record</h2>
            </div>
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-record-edit-form record-id={editedRecordId} object-api-name="Account" onsuccess={handleSuccess} onerror={handleError}>
                                        
                    <div class="slds-grid slds-gutters">
                         <div class="slds-col slds-size_1-of-3">
                            <lightning-input-field field-name="Name"></lightning-input-field>
                        </div>
                          <div class="slds-col slds-size_1-of-3">
                            <lightning-input-field field-name="email__c"></lightning-input-field>
                        </div>
                          <div class="slds-col slds-size_1-of-3">
                            <lightning-input-field field-name="Phone"></lightning-input-field>
                        </div>
                    </div>
                  <div class="slds-modal__footer">
               <button class="slds-button slds-button_neutral" type="button" onclick={closeEditForm}>Cancel</button>
                <lightning-button
                class="slds-m-top_small"
                variant="brand"
                type="submit"
                name="update"
                label="Update"
            >
            </lightning-button> 
            </div>
                </lightning-record-edit-form>
            </div>
            
        </div>
    </div>
    <div class="slds-backdrop slds-backdrop_open"></div>
    
</template>
</template>
