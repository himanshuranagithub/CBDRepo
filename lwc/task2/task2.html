<template>
    <lightning-card title="Account List">
        <!-- Card Header -->
        <div class="slds-card__header slds-grid slds-grid_align-spread slds-p-around_medium">
            <h2 class="slds-text-heading_small">Account List</h2>
            <div class="slds-button-group">
                <lightning-button label="Publish Account IDs" onclick={handlePublishAccountIds}></lightning-button>
                <lightning-button label="Delete Selected" onclick={handleDeleteSelected}></lightning-button>
            </div>
        </div>
        
        <!-- Search Input -->
        <div class="slds-p-around_medium">
            <lightning-input type="search" label="Search" onchange={handleSearchKeyChange}></lightning-input>
        </div>

        <!-- Custom Table -->
        <div class="slds-p-around_medium">
            <table class="slds-table slds-table_bordered slds-table_fixed slds-table_striped">
                <thead>
                    <tr>
                        <th class="slds-text-align_left">Name</th>
                        <th class="slds-text-align_left">Industry</th>
                        <th class="slds-text-align_left">Phone</th>
                        <th class="slds-text-align_left">Website</th>
                        <th class="slds-text-align_center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={accounts} for:item="account">
                        <tr key={account.Id}>
                            <td>{account.Name}</td>
                            <td>{account.Industry}</td>
                            <td>{account.Phone}</td>
                            <td>
                                <a href={account.Website} target="_blank">{account.Website}</a>
                            </td>
                            <td class="slds-text-align_center">
                                <!-- Actions Column -->
                                <lightning-button-icon icon-name="utility:edit" alternative-text="Update" title="Update"
                                    onclick={handleRowAction} data-id={account.Id} data-action="update">
                                </lightning-button-icon>
                                <lightning-button-icon icon-name="utility:delete" alternative-text="Delete" title="Delete"
                                    onclick={handleRowAction} data-id={account.Id} data-action="delete">
                                </lightning-button-icon>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- Modal for Updating Account -->
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Update Account</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input label="Name" name="Name" value={currentRecord.Name}
                            onchange={handleFieldChange}></lightning-input>
                        <lightning-input label="Industry" name="Industry" value={currentRecord.Industry}
                            onchange={handleFieldChange}></lightning-input>
                        <lightning-input label="Phone" name="Phone" value={currentRecord.Phone}
                            onchange={handleFieldChange}></lightning-input>
                        <lightning-input label="Website" name="Website" value={currentRecord.Website}
                            onchange={handleFieldChange}></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={handleModalClose}></lightning-button>
                        <lightning-button variant="brand" label="Save" onclick={handleSave}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
