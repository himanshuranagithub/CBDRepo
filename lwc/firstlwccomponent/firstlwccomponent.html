<template>
    <div>
    <div> Name : {Name} </div>
    <div> Email : {Email} </div>
    <div> Phone : {Phone} </div>
    </div>
<lightning-card    title="condtional rendering">
   <div class="slds-m-around_medium">
       <lightning-input type="checkbox"  label="showdetails" onchange='{handelChange}'></lightning-input>
       <template if:true={aredetailsvisible}>
           <div class="slds-m-vertical_medium">
               My name is vikas.
           </div>
       </template>
       
       <template if:false = {aredetailsvisible}>
           <div class="slds-m-vertical_medium">
               My name is Ram.
           </div>
       </template>
   </div>
</lightning-card>
</template>
